# LibreChat custom endpoint: the SAME four original Bastilla live-chat workers.
# This bridge does not create replacement agents. A worker must be online to reply.
version: 1.3.18
cache: true
# Native LibreChat user memory persists across chats in LibreChat's database.
# Managed manually in Memories; automatic extraction is deliberately OFF
# (no hidden model calls or billing for a separate memory agent).
memory:
  disabled: false
  personalize: true
  validKeys:
    - user_preferences
    - conversation_context
    - project_context
    - learned_facts
  tokenLimit: 8000
  charLimit: 10000
endpoints:
  custom:
    - name: "Bastilla Agents"
      apiKey: "${BASTILLA_BRIDGE_API_KEY}"
      baseURL: "http://bastilla-agent-bridge:8085/v1"
      models:
        default: ["Aria", "Alex", "Astyria", "Aurelius"]
        fetch: false
      modelDisplayLabel: "Bastilla Agents"
      titleConvo: false
