# Additive LibreChat override. Never replace upstream docker-compose.yml.
# Run via scripts/setup-librechat.sh; no additional host ports for the bridge.
services:
  api:
    volumes:
      - type: bind
        source: ${BASTILLA_LIBRECHAT_YAML:?Set BASTILLA_LIBRECHAT_YAML}
        target: /app/librechat.yaml
        read_only: true
    environment:
      - BASTILLA_BRIDGE_API_KEY=${BASTILLA_BRIDGE_API_KEY:?Set BASTILLA_BRIDGE_API_KEY}
  bastilla-agent-bridge:
    build:
      context: ${BASTILLA_REPO_ROOT:?Set BASTILLA_REPO_ROOT}/integrations/librechat/bridge
    restart: unless-stopped
    environment:
      PORT: "8085"
      BASTILLA_BRIDGE_API_KEY: ${BASTILLA_BRIDGE_API_KEY:?Set BASTILLA_BRIDGE_API_KEY}
      BASTILLA_LIBRECHAT_OWNER_EMAIL: ${BASTILLA_LIBRECHAT_OWNER_EMAIL:?Set BASTILLA_LIBRECHAT_OWNER_EMAIL}
      BASTILLA_API_BASE_URL: ${BASTILLA_API_BASE_URL:-http://host.docker.internal:3000}
      BASTILLA_LIVE_CHAT_ALLOWED_ORIGIN: ${BASTILLA_LIVE_CHAT_ALLOWED_ORIGIN:?Set BASTILLA_LIVE_CHAT_ALLOWED_ORIGIN}
      BASTILLA_LIVE_CHAT_USER_PASSWORD: ${BASTILLA_LIVE_CHAT_USER_PASSWORD:?Set BASTILLA_LIVE_CHAT_USER_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8085"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
