name: Debian 13 validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.devcontainer/debian13/**'
      - '.github/workflows/debian13-validation.yml'
      - 'docs/DEBIAN13_AGENT_SETUP.md'
      - 'debian13/**'
permissions:
  contents: read
concurrency:
  group: debian13-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Debian release and workspace isolation
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$VERSION_ID" = "13"
          apt-get update
          apt-get install -y --no-install-recommends python3
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path(".devcontainer/debian13/devcontainer.json").read_text())
          expected = "/workspaces/${localWorkspaceFolderBasename}/debian13"
          assert config["workspaceFolder"] == expected, "Workspace must target debian13"
          assert Path("debian13/README.md").is_file(), "Workspace directory must exist"
          assert config["portsAttributes"]["3000"]["visibility"] == "private"
          print("Debian 13 configuration and independent workspace verified")
          PY
